id: ah6
display-name: "<gold>AH-6 Light Helicopter"
class: helicopter
model: ah6
physics:
  mass: 1600                 # kg
  max-speed: 28              # blocks/s horizontal (quadratic drag saturates here)
  climb-rate: 8              # blocks/s
  descent-rate: 10           # blocks/s
  max-yaw-rate: 70           # degrees/s
  max-tilt: 22               # degrees of rotor-disc tilt
  tilt-rate-deg: 45          # degrees/s
  cyclic-gain: 1.0
  vertical-accel: 8          # blocks/s^2
  spool-time: 3              # seconds
  autorotation-descent: 6    # blocks/s with the engine off
  ground-effect: 0.15
  hover-settle-time: 6       # seconds from full speed to hover after releasing the cyclic
  max-horizontal-speed: 28   # hard clamps (safety net)
  max-climb-speed: 8
  max-descent-speed: 10
  auto-stabilise: true
  rotor-speed: 45
  auto-start-engine: true
hud-skin: aircraft               # shader HUD texture set: military | civilian | aircraft
gauge:
  max-speed: 31              # blocks/s at full scale (110 km/h)
  sweep: 270                 # needle sweep in degrees
  redline: 0.85              # fraction of full scale where the needle turns red and jitters
  fuel: arc                   # bar | arc
health: 420
armor: { front: 6, side: 4, rear: 4, top: 3, bottom: 5 }
fuel: { capacity: 110, consumption: 0.5 }
seats:
  - { name: pilot, locator: seat_pilot, role: driver, weapons: [minigun, rockets, flares] }
  - { name: copilot, locator: seat_copilot, role: copilot }
weapons:
  minigun:
    type: mg
    display-name: "Minigun"
    muzzle: [muzzle_mg_l, muzzle_mg_r]
    damage: 6
    penetration: 10
    rpm: 1500
    spread: 1.8
    magazine: 500
    ammo: 2000
    reload: 6
    velocity: 13
    traverse-speed: 30
    yaw-min: -15
    yaw-max: 15
    pitch-min: -25
    pitch-max: 10
  rockets:
    type: rocket
    display-name: "Rocket Pods"
    muzzle: [muzzle_pod_l, muzzle_pod_r]
    damage: 50
    penetration: 45
    splash: 3
    splash-damage: 40
    explosion-power: 1.8
    velocity: 6
    rpm: 150
    magazine: 14
    ammo: 28
    reload: 10
    block-damage: true
    traverse-speed: 0
    yaw-min: 0
    yaw-max: 0
    pitch-min: 0
    pitch-max: 0
  flares:
    type: flare
    display-name: "Flares"
    ammo: 8
    magazine: 8
    flare-ticks: 80
    cooldown-ticks: 60
sounds:
  engine: minecraft:entity.ender_dragon.flap
