id: speedboat
display-name: "<aqua>Speedboat"
class: boat
model: speedboat
physics:
  mass: 1400                 # kg
  engine-force: 8000         # N
  max-speed: 22              # blocks/s
  max-reverse-speed: 5
  yaw-rate: 52               # degrees/s at speed
  draft: 0.45                # blocks below the surface
  buoyancy: 6                # 1/s spring toward the float line
  water-drag: 1.2            # N per (blocks/s)^2
  planing-speed: 9           # blocks/s
  planing-pitch: 7           # degrees
  rudder: 1.1
  lateral-grip: 2.5          # 1/s
  auto-start-engine: true
hud-skin: civilian               # shader HUD texture set: military | civilian | aircraft
gauge:
  max-speed: 28              # blocks/s at full scale (100 km/h)
  sweep: 270                 # needle sweep in degrees
  redline: 0.85              # fraction of full scale where the needle turns red and jitters
  fuel: arc                   # bar | arc
health: 320
armor: { front: 3, side: 2, rear: 2, top: 1 }
fuel: { capacity: 80, consumption: 0.35 }
seats:
  - { name: driver, locator: seat_driver, role: driver, exposed: true }
  - { name: passenger, locator: seat_passenger, role: passenger, exposed: true }
  - { name: gunner, locator: seat_gunner, role: gunner, weapons: [bow_mg], exposed: true }
  - { name: rear, locator: seat_rear, role: passenger, exposed: true }
weapons:
  bow_mg:
    type: mg
    display-name: "Bow MG"
    muzzle: [muzzle_1]
    damage: 7
    rpm: 550
    magazine: 150
    ammo: 900
    traverse-speed: 140
    yaw-min: -110
    yaw-max: 110
sounds:
  engine: minecraft:entity.boat.paddle_water
