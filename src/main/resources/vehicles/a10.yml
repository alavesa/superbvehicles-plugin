id: a10
display-name: "<gold>A-10 Attack Aircraft"
class: plane
model: a10
physics:
  mass: 11000                # kg
  engine-force: 99000        # N (thrust)
  max-speed: 55              # blocks/s
  stall-speed: 18            # blocks/s
  min-takeoff-speed: 22      # blocks/s
  lift: 1.1
  pitch-rate: 45             # degrees/s
  roll-rate: 72              # degrees/s
  max-yaw-rate: 40           # degrees/s
  flap-speed: 30             # blocks/s
  airbrake-drag: 3.0         # blocks/s^2 extra at max speed
  throttle-rate: 0.3         # throttle fraction per second
  alignment: 1.6             # 1/s
  max-climb-speed: 25
  max-descent-speed: 45
  turn-gain: 1.0
  auto-start-engine: true
hud-skin: aircraft               # shader HUD texture set: military | civilian | aircraft
gauge:
  max-speed: 61              # blocks/s at full scale (220 km/h)
  sweep: 270                 # needle sweep in degrees
  redline: 0.85              # fraction of full scale where the needle turns red and jitters
  fuel: arc                   # bar | arc
health: 700
armor: { front: 20, side: 12, rear: 10, top: 6, bottom: 25 }
fuel: { capacity: 300, consumption: 1.0 }
seats:
  - { name: pilot, locator: seat_pilot, role: driver, weapons: [cannon, bombs, missiles, flares] }
weapons:
  cannon:
    type: autocannon
    display-name: "30 mm Rotary Cannon"
    muzzle: [muzzle_cannon]
    damage: 30
    penetration: 60
    rpm: 900
    spread: 0.6
    magazine: 150
    ammo: 1150
    reload: 8
    velocity: 16
    splash: 1.2
    splash-damage: 12
    block-damage: false
    traverse-speed: 0
    yaw-min: 0
    yaw-max: 0
    pitch-min: 0
    pitch-max: 0
  bombs:
    type: bomb
    display-name: "Bombs"
    muzzle: [muzzle_bomb_l, muzzle_bomb_r]
    damage: 260
    penetration: 80
    splash: 8
    splash-damage: 200
    explosion-power: 5
    rpm: 60
    magazine: 6
    ammo: 6
    reload: 0
    block-damage: true
  missiles:
    type: missile
    display-name: "Guided Missiles"
    guidance: lock
    muzzle: [muzzle_msl_l, muzzle_msl_r]
    damage: 200
    penetration: 250
    splash: 3
    explosion-power: 2.5
    velocity: 5
    turn-rate: 7
    lock-time: 1.5
    lock-range: 220
    lock-cone: 12
    rpm: 20
    magazine: 2
    ammo: 4
    reload: 0
    lifetime: 14
  flares:
    type: flare
    display-name: "Flares"
    ammo: 10
    magazine: 10
    flare-ticks: 90
    cooldown-ticks: 60
